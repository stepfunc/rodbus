name: CI
on:
  push:
    tags:
      - "*"
  pull_request:
  # The merge queue runs the required checks on each queued merge result
  merge_group:
  # Runs everything a release tag builds, without publishing (see RELEASING.md)
  workflow_dispatch:
# Jobs that write with GITHUB_TOKEN ask for it themselves
permissions:
  contents: read
# A newer push to a PR cancels its older run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Check formatting and run clippy lints. Clippy on the workspace also compiles the FFI crates
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'pull_request' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy the workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy the core crate with all features (ring)
        run: cargo clippy -p rodbus --all-targets --features ffi,serialization -- -D warnings
      - name: Clippy the core crate with all features (AWS-LC)
        run: cargo clippy -p rodbus --all-targets --no-default-features --features ffi,serial,tls-aws-lc,serialization -- -D warnings
  # Check the feature permutations not built by default
  features:
    strategy:
      fail-fast: false
      matrix:
        feature-args:
          - "--no-default-features"
          - "--no-default-features --features serial"
          - "--no-default-features --features tls"
          - "--no-default-features --features tls-aws-lc"
          - "--no-default-features --features serialization"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ strategy.job-index }}
          save-if: ${{ github.event_name == 'pull_request' }}
      - name: Clippy the core crate and its tests with the features
        run: cargo clippy -p rodbus --all-targets ${{ matrix.feature-args }} -- -D warnings
      # rodbus is selected too because the FFI crates don't have every feature (serialization)
      - name: Check the FFI crates with the features
        run: cargo check -p rodbus -p rodbus-ffi -p rodbus-ffi-java ${{ matrix.feature-args }}
  # Check the workspace with the minimum supported Rust version declared in Cargo.toml
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read the minimum supported Rust version
        id: msrv
        # a two-part rust-version means the .0 release, so check exactly that toolchain
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="$version.0"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'pull_request' }}
      - name: Check the workspace
        run: cargo check --locked --workspace --all-targets
      - name: Check the AWS-LC TLS backend
        run: cargo check --locked -p rodbus --no-default-features --features ffi,serial,tls-aws-lc,serialization
  # Run the unit tests on Linux; Windows too in the merge queue and for releases
  test:
    # a test that hangs fails the job instead of holding it for GitHub's six-hour default
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'pull_request' }}
      - name: Run Rust unit tests
        run: cargo test
  # Check that a change keeps the core crate's public API semver compatible with the revision it
  # merges into. Tag pushes and manual runs have no such revision, so only the checkout runs there.
  # The toolchain and the checker are pinned so an upstream release can't fail an unchanged PR
  # (the checker reads rustdoc's JSON, whose format changes with the toolchain); raise them together
  semver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - name: Install cargo-binstall
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
      - name: Install cargo-semver-checks
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: cargo binstall cargo-semver-checks@0.51.0 --no-confirm
      - name: Compare the public API with the base revision
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          rust-toolchain: manual
          package: rodbus
          # every feature with public API; tls and tls-aws-lc can't be enabled together
          feature-group: only-explicit-features
          features: default,ffi,serialization
          # every change must be at most a minor release; derived from a pre-release version
          # (1.6.0-M3) the tool would skip every check
          release-type: minor
          baseline-rev: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  # Check that the frame readers and parsers can't panic for any input
  # (rodbus/src/no_panic_check.rs). The proof comes from the optimizer, so the toolchain is pinned:
  # a new one can lose an optimization and fail the link without any change to the code. Raise it
  # deliberately.
  no-panic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'pull_request' }}
      - name: Link the parsers with the no-panic check
        run: cargo test -p rodbus --lib --release --no-run
        env:
          RUSTFLAGS: --cfg rodbus_no_panic
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
  # The check branch protection requires: passes only if every job a PR runs passed
  ci-ok:
    needs: [linting, features, msrv, test, semver, no-panic]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the CI jobs
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
  # Everything below builds the bindings and their packages: only for release tags and manual runs.
  # A PR's FFI changes are compiled by the linting job's clippy on the workspace
  # Build API documentation packages
  documentation:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install doxygen 1.9.5
        run: wget -q https://github.com/stepfunc/ci-files/raw/main/doxygen/doxygen-1.9.5.linux.bin.tar.gz -O- | sudo tar --strip-components=1 -C /usr -xz doxygen-1.9.5
      - name: Build FFI and JNI
        run: cargo build --release -p rodbus-ffi -p rodbus-ffi-java
      - name: Build Rustdoc
        run: cargo doc -p rodbus --no-deps
      - name: C bindings
        run: cargo run --bin rodbus-bindings -- --c --doxygen --no-tests
      - name: .NET bindings
        run: cargo run --bin rodbus-bindings -- --dotnet --doxygen --no-tests
      - name: Java bindings
        run: cargo run --bin rodbus-bindings -- --java
      - name: Extract documentation
        run: |
          mkdir -p ~/doc
          cp -a target/doc ~/doc/rust
          cp -a ffi/bindings/c/generated/doc/c ~/doc/c
          cp -a ffi/bindings/c/generated/doc/cpp ~/doc/cpp
          cp -a ffi/bindings/dotnet/rodbus/doc ~/doc/dotnet
          cp -a ffi/bindings/java/rodbus/target/apidocs ~/doc/java
          rm ffi/bindings/c/generated/logo.png ffi/bindings/c/generated/doxygen-awesome.css
      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: doc-api
          path: ~/doc
  # Build bindings on Windows x64 [64-bit MSVC (Windows 7+) (x86_64-pc-windows-msvc)] and x86 [32-bit MSVC (Windows 7+) (i686-pc-windows-msvc)]
  bindings-windows:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc # 64-bit MSVC (Windows 7+)
            test: true
          - target: i686-pc-windows-msvc # 32-bit MSVC (Windows 7+)
            test: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Create the FFI modules dir
        run: mkdir ffi-modules\${{ matrix.target }}
      - name: Build FFI
        shell: bash
        run: bash .github/scripts/build-evidence.sh evidence/ffi/${{ matrix.target }} cargo -p rodbus-ffi --target ${{ matrix.target }} --no-default-features --features tls-aws-lc,serial
      - name: Build JNI
        shell: bash
        run: bash .github/scripts/build-evidence.sh evidence/java/${{ matrix.target }} cargo -p rodbus-ffi-java --target ${{ matrix.target }} --no-default-features --features tls-aws-lc,serial
      - name: Copy the FFI and JNI libs
        shell: pwsh
        run: |
          Copy-Item -Path ./target/${{ matrix.target }}/release/rodbus_ffi.dll -Destination ffi-modules/${{ matrix.target }}
          Copy-Item -Path ./target/${{ matrix.target }}/release/rodbus_ffi.dll.lib -Destination ffi-modules/${{ matrix.target }}
          Copy-Item -Path ./target/${{ matrix.target }}/release/rodbus_ffi_java.dll -Destination ffi-modules/${{ matrix.target }}
      - name: Upload compiled FFI modules
        uses: actions/upload-artifact@v7
        with:
          name: ffi-modules-${{ matrix.target }}
          path: ffi-modules
      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.target }}
          path: evidence
      - name: C Bindings Tests
        if: ${{ matrix.test }}
        run: cargo run --bin rodbus-bindings -- --c -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
      - name: Test .NET Bindings
        if: ${{ matrix.test }}
        run: cargo run --bin rodbus-bindings -- --dotnet -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
      - name: Test Java Bindings
        if: ${{ matrix.test }}
        run: cargo run --bin rodbus-bindings -- --java -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
  # Build bindings on MacOS [64-bit macOS (10.7+, Lion+) (x86_64-apple-darwin)]
  bindings-macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Create FFI modules dir
        run: mkdir -p ffi-modules/${{ matrix.target }}
      - name: Build FFI
        run: bash .github/scripts/build-evidence.sh evidence/ffi/${{ matrix.target }} cargo -p rodbus-ffi --target ${{ matrix.target }} --no-default-features --features tls-aws-lc,serial
      - name: Build JNI
        run: bash .github/scripts/build-evidence.sh evidence/java/${{ matrix.target }} cargo -p rodbus-ffi-java --target ${{ matrix.target }} --no-default-features --features tls-aws-lc,serial
      - name: Copy the FFI and JNI libs
        run: |
          cp ./target/${{ matrix.target }}/release/librodbus_ffi.dylib ./ffi-modules/${{ matrix.target }}
          cp ./target/${{ matrix.target }}/release/librodbus_ffi_java.dylib ./ffi-modules/${{ matrix.target }}
      - name: Upload compiled FFI modules
        uses: actions/upload-artifact@v7
        with:
          name: ffi-modules-${{ matrix.target }}
          path: ffi-modules
      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.target }}
          path: evidence
      - name: Test .NET bindings
        run: cargo run --bin rodbus-bindings -- --dotnet -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
      - name: Test Java bindings
        run: cargo run --bin rodbus-bindings -- --java -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
  # Cross-compilation for Linux to produce portable C and JNI libraries
  bindings-linux:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      # By default, MUSL will not produce a cdylib with dynamic linkage to MUSL LIB C
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=-crt-static"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=-crt-static"
      CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_RUSTFLAGS: "-C target-feature=-crt-static"
    strategy:
      fail-fast: false
      matrix:
        cases:
          - target: x86_64-unknown-linux-gnu # 64-bit Linux (kernel 2.6.32+, glibc 2.11+)
            features: tls-aws-lc,serial
          - target: x86_64-unknown-linux-musl # 64-bit Linux with MUSL
            features: tls,serial
          - target: arm-unknown-linux-gnueabihf # ARMv6 Linux, hardfloat (kernel 3.2, glibc 2.17)
            features: tls,serial
          - target: arm-unknown-linux-musleabihf # ARMv6 Linux with MUSL, hardfloat
            features: tls,serial
          - target: aarch64-unknown-linux-gnu # ARM64 Linux (kernel 4.2, glibc 2.17+)
            features: tls-aws-lc,serial
          - target: aarch64-unknown-linux-musl # ARM64 Linux with MUSL
            features: tls,serial
          - target: armv7-unknown-linux-gnueabihf # ARMv7 Linux, hardfloat (kernel 3.2, glibc 2.17)
            features: tls,serial
          - target: arm-unknown-linux-gnueabi # ARMv6 Linux (kernel 3.2, glibc 2.17)
            features: tls,serial
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust Cross
        run: cargo install cross
      - name: Create FFI modules dir
        run: mkdir -p ffi-modules/${{ matrix.cases.target }}
      - name: Build FFI
        run: bash .github/scripts/build-evidence.sh evidence/ffi/${{ matrix.cases.target }} cross -p rodbus-ffi --target ${{ matrix.cases.target }} --no-default-features --features ${{ matrix.cases.features }}
      - name: Build JNI
        run: bash .github/scripts/build-evidence.sh evidence/java/${{ matrix.cases.target }} cross -p rodbus-ffi-java --target ${{ matrix.cases.target }} --no-default-features --features ${{ matrix.cases.features }}
      - name: Copy the FFI and JNI libs
        run: |
          cp ./target/${{ matrix.cases.target }}/release/librodbus_ffi.so ./ffi-modules/${{ matrix.cases.target }}
          cp ./target/${{ matrix.cases.target }}/release/librodbus_ffi_java.so ./ffi-modules/${{ matrix.cases.target }}
      - name: Upload compiled FFI modules
        uses: actions/upload-artifact@v7
        with:
          name: ffi-modules-${{ matrix.cases.target }}
          path: ffi-modules
      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.cases.target }}
          path: evidence
  guide:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        working-directory: guide
        run: npm ci
      - name: Build guide
        working-directory: guide
        run: |
         npm run build
         mkdir -p ~/doc/guide
         mv build/* ~/doc/guide
      - name: Upload guide
        uses: actions/upload-artifact@v7
        with:
          name: doc-guide
          path: ~/doc
  # Package all the generated bindings
  packaging:
    needs: [documentation, bindings-windows, bindings-macos, bindings-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install bom-tools
        run: cargo install --locked --git https://github.com/stepfunc/bom-tools.git --tag 0.3.0
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download compiled FFI
        uses: actions/download-artifact@v8
        with:
          pattern: ffi-modules-*
          path: ffi-modules
          merge-multiple: true
      - name: Download build evidence
        uses: actions/download-artifact@v8
        with:
          path: evidence
          pattern: evidence-*
          merge-multiple: true
      - name: Create third-party license reports and SBOMs
        run: |
          cargo metadata --format-version 1 --all-features --locked > metadata.json
          COMMON="-m metadata.json -c allowed.json"
          bom-tools licenses -e evidence/ffi --root-package rodbus-ffi $COMMON > third-party-licenses.txt
          bom-tools licenses -e evidence/java --root-package rodbus-ffi-java $COMMON > third-party-licenses-java.txt
          mkdir sboms
          bom-tools sbom -e evidence/ffi --root-package rodbus-ffi $COMMON --lockfile Cargo.lock > sboms/rodbus-ffi.cdx.json
          bom-tools sbom -e evidence/java --root-package rodbus-ffi-java $COMMON --lockfile Cargo.lock > sboms/rodbus-ffi-java.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sboms
          path: sboms
      - name: Package C/C++ bindings
        run: cargo run --bin rodbus-bindings -- --c --package ./ffi-modules --options ./packaging.json -f third-party-licenses.txt -f sboms/rodbus-ffi.cdx.json
      - name: Package .NET bindings
        run: cargo run --bin rodbus-bindings -- --dotnet --package ./ffi-modules --options ./packaging.json -f third-party-licenses.txt -f sboms/rodbus-ffi.cdx.json
      - name: Package Java bindings
        run: cargo run --bin rodbus-bindings -- --java --package ./ffi-modules --options ./packaging.json -f third-party-licenses-java.txt -f sboms/rodbus-ffi-java.cdx.json
      - name: Upload C/C++ bindings
        uses: actions/upload-artifact@v7
        with:
          name: c-bindings
          path: ffi/bindings/c/generated/*
      - name: Upload .NET bindings
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-bindings
          path: ffi/bindings/dotnet/nupkg/*
      - name: Upload Java bindings
        uses: actions/upload-artifact@v7
        with:
          name: java-bindings-jar
          path: ffi/bindings/java/rodbus/target/*.jar
      - name: Upload Java pom.xml
        uses: actions/upload-artifact@v7
        with:
          name: java-bindings-pom
          path: ffi/bindings/java/rodbus/pom.xml
  # Quality gate to ensure all tests pass before releases
  quality-gate:
    needs: [linting, features, msrv, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Quality checks passed
        run: echo "✅ All quality checks passed successfully"

  # Release jobs - each can run independently and is idempotent
  release-docs:
    needs: [packaging, guide, quality-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: doc-*
      - name: Checkout stepfunc/docs
        uses: actions/checkout@v7
        with:
          repository: stepfunc/docs
          ssh-key: ${{ secrets.SFIO_DOCS_SSH_KEY }}
          path: docs
      - name: Upload docs
        working-directory: docs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # Pull latest changes to avoid conflicts
          git pull
          # Remove and recreate docs directory
          rm -rf ./rodbus/${{github.ref_name}}
          mkdir -p ./rodbus/${{github.ref_name}}
          cp -a ../artifacts/doc-api/* ./rodbus/${{github.ref_name}}
          cp -a ../artifacts/doc-guide/* ./rodbus/${{github.ref_name}}
          # Remove versions superseded under the docs repo's retention policy
          ./scripts/prune.sh
          # Check if there are actual changes to commit
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit - docs already up to date"
          else
            git commit -m "[rodbus] release ${{github.ref_name}}"
            git push
          fi

  release-maven:
    needs: [packaging, quality-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Java artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: java-bindings-*
      - name: Import PGP key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.SFIO_PGP_PRIVATE_KEY }}
          passphrase: ${{ secrets.SFIO_PGP_PRIVATE_KEY_PASSPHRASE }}
      - name: Deploy Java to Maven Central
        shell: bash
        working-directory: artifacts
        run: |
          # Check if artifact already exists or is being published
          if curl -f -s -o /dev/null "https://repo1.maven.org/maven2/io/stepfunc/rodbus/${{github.ref_name}}/rodbus-${{github.ref_name}}.jar"; then
            echo "✅ Artifact io.stepfunc:rodbus:${{github.ref_name}} already exists in Maven Central - skipping deployment"
          else
            echo "Artifact not found in Maven Central - checking if deployment is in progress..."

            # Create base64 encoded token for Authorization header
            AUTH_TOKEN=$(echo -n "${{ secrets.MAVEN_CENTRAL_USERNAME }}:${{ secrets.MAVEN_CENTRAL_TOKEN }}" | base64 -w 0)

            # Try to upload - if it fails due to duplicate, that means it's already being processed
            echo "Attempting to upload to Central Portal..."

            # Create Maven repository structure (starting from groupId)
            mkdir -p io/stepfunc/rodbus/${{github.ref_name}}

            # Copy artifacts to bundle directory
            cp java-bindings-pom/pom.xml io/stepfunc/rodbus/${{github.ref_name}}/rodbus-${{github.ref_name}}.pom
            cp java-bindings-jar/rodbus-${{github.ref_name}}.jar io/stepfunc/rodbus/${{github.ref_name}}/
            cp java-bindings-jar/rodbus-${{github.ref_name}}-sources.jar io/stepfunc/rodbus/${{github.ref_name}}/
            cp java-bindings-jar/rodbus-${{github.ref_name}}-javadoc.jar io/stepfunc/rodbus/${{github.ref_name}}/

            # Sign all files. v7 of ghaction-import-gpg does not configure a default
            # signing key, so select it explicitly by fingerprint (the action's
            # recommended user ID) to avoid "no default secret key" errors.
            cd io/stepfunc/rodbus/${{github.ref_name}}
            for file in *.jar *.pom; do
              gpg --batch --yes --pinentry-mode loopback --local-user "${{ steps.import_gpg.outputs.fingerprint }}" --passphrase "${{ secrets.SFIO_PGP_PRIVATE_KEY_PASSPHRASE }}" --armor --detach-sign "$file"
            done

            # Generate checksums
            for file in *.jar *.pom; do
              md5sum "$file" | cut -d' ' -f1 > "$file.md5"
              sha1sum "$file" | cut -d' ' -f1 > "$file.sha1"
            done

            # Create bundle zip
            cd ../../../..
            zip -r bundle.zip io/

            # Upload bundle to Central Portal
            echo "Uploading bundle to Central Portal..."
            RESPONSE=$(curl -X POST \
              "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
              -H "Authorization: Bearer $AUTH_TOKEN" \
              -H "Content-Type: multipart/form-data" \
              -F "bundle=@bundle.zip;type=application/octet-stream" \
              -w "\nHTTP_STATUS:%{http_code}" \
              -s)

            # Extract HTTP status code
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | sed '$d')  # Remove last line with status code

            echo "Response: $BODY"
            echo "HTTP Status: $HTTP_STATUS"

            # Handle response
            if [[ $HTTP_STATUS -ge 200 && $HTTP_STATUS -lt 300 ]]; then
              # The API returns the deployment ID as plain text, not JSON
              DEPLOYMENT_ID=$(echo "$BODY" | tr -d '[:space:]')
              echo "✅ Upload successful! Deployment ID: $DEPLOYMENT_ID"
              echo "The deployment will be automatically published to Maven Central after validation."
            elif [[ $HTTP_STATUS -eq 400 ]] && [[ "$BODY" =~ "duplicate" || "$BODY" =~ "already exists" || "$BODY" =~ "PUBLISHED" ]]; then
              echo "✅ Version ${{github.ref_name}} is already uploaded or being processed - skipping deployment"
            else
              echo "❌ Upload failed with status $HTTP_STATUS"
              echo "Error details: $BODY"
              exit 1
            fi
          fi

  # Release jobs that publish to crates.io and nuget.org. Both registries trust this workflow in
  # these environments (trusted publishing), so neither needs a stored API key
  release-nuget:
    needs: [packaging, quality-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download .NET artifacts
        uses: actions/download-artifact@v8
        with:
          name: dotnet-bindings
          path: artifacts/dotnet-bindings
      # the temporary API key lasts an hour, so get it just before pushing
      - name: Authenticate with nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet package
        shell: bash
        run: |
          # Use --skip-duplicate to make this idempotent
          dotnet nuget push $(find artifacts/dotnet-bindings/rodbus*.nupkg) \
            -s https://api.nuget.org/v3/index.json \
            -k ${{ steps.login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

  release-crates-io:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the crate version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rodbus") | .version')
          if [ "$VERSION" != "${{github.ref_name}}" ]; then
            echo "❌ tag ${{github.ref_name}} doesn't match the crate version $VERSION"
            exit 1
          fi
      - name: Check whether this version is already published
        id: published
        run: |
          VERSION=${{github.ref_name}}
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-all-errors \
            -A "stepfunc/rodbus release workflow" "https://crates.io/api/v1/crates/rodbus/$VERSION")
          case "$STATUS" in
            200)
              echo "✅ rodbus $VERSION already published to crates.io - skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "Publishing rodbus $VERSION to crates.io..."
              ;;
            *)
              echo "❌ crates.io returned HTTP $STATUS"
              exit 1
              ;;
          esac
      - name: Authenticate with crates.io
        if: steps.published.outputs.skip != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        if: steps.published.outputs.skip != 'true'
        run: cargo publish -p rodbus
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  create-github-release:
    needs: [release-docs, release-maven, release-nuget, release-crates-io]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    # creates the draft release and uploads its assets
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Package C Bindings
        run: |
          mkdir release
          cd artifacts/c-bindings
          zip -r ../../release/rodbus-${{github.ref_name}}.zip .
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            release/*.zip
            artifacts/dotnet-bindings/rodbus*
            artifacts/java-bindings-jar/*.jar
            artifacts/sboms/*.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
