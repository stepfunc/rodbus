name: CI
on:
  push:
    tags:
      - "*"
  pull_request:
  # The merge queue runs the required checks on each queued merge result
  merge_group:
  # Runs everything a release tag builds, without publishing (see RELEASE.md)
  workflow_dispatch:
# Jobs that write with GITHUB_TOKEN ask for it themselves
permissions:
  contents: read
# A newer push to a PR cancels its older run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Check formatting and run clippy lints. Clippy on the workspace also compiles the FFI crates
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache the build
        # only PR runs cache, so tag and merge-queue builds never restore one a PR wrote, and this
        # job builds nothing that ships
        if: github.event_name == 'pull_request' # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy the workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy the core crate with all features (ring)
        run: cargo clippy -p rodbus --all-targets --features ffi,serialization -- -D warnings
      - name: Clippy the core crate with all features (AWS-LC)
        run: cargo clippy -p rodbus --all-targets --no-default-features --features ffi,serial,tls-aws-lc,serialization -- -D warnings
  # Check the feature permutations not built by default
  features:
    strategy:
      fail-fast: false
      matrix:
        feature-args:
          - "--no-default-features"
          - "--no-default-features --features serial"
          - "--no-default-features --features tls"
          - "--no-default-features --features tls-aws-lc"
          - "--no-default-features --features serialization"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - name: Cache the build
        # only PR runs cache, so tag and merge-queue builds never restore one a PR wrote, and this
        # job builds nothing that ships
        if: github.event_name == 'pull_request' # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: features-${{ strategy.job-index }}
      - name: Clippy the core crate and its tests with the features
        run: cargo clippy -p rodbus --all-targets ${{ matrix.feature-args }} -- -D warnings
      # rodbus is selected too because the FFI crates don't have every feature (serialization)
      - name: Check the FFI crates with the features
        run: cargo check -p rodbus -p rodbus-ffi -p rodbus-ffi-c -p rodbus-ffi-java ${{ matrix.feature-args }}
  # Check the workspace with the minimum supported Rust version declared in Cargo.toml
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the minimum supported Rust version
        id: msrv
        # a two-part rust-version means the .0 release, so check exactly that toolchain
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="$version.0"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache the build
        # only PR runs cache, so tag and merge-queue builds never restore one a PR wrote, and this
        # job builds nothing that ships
        if: github.event_name == 'pull_request' # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check the workspace
        run: cargo check --locked --workspace --all-targets
      - name: Check the AWS-LC TLS backend
        run: cargo check --locked -p rodbus --no-default-features --features ffi,serial,tls-aws-lc,serialization
  # Run the unit tests on Linux; Windows too in the merge queue and for releases
  test:
    # a test that hangs fails the job instead of holding it for GitHub's six-hour default
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Cache the build
        # only PR runs cache, so tag and merge-queue builds never restore one a PR wrote, and this
        # job builds nothing that ships
        if: github.event_name == 'pull_request' # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run Rust unit tests
        run: cargo test --workspace --features rodbus/ffi,rodbus/serialization
      - name: Run the core crate's tests with the AWS-LC TLS backend
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p rodbus --no-default-features --features ffi,serial,tls-aws-lc,serialization
  # Check that a change keeps the core crate's public API semver compatible with the revision it
  # merges into. Tag pushes and manual runs have no such revision, so only the checkout runs there.
  # The toolchain and the checker are pinned so an upstream release can't fail an unchanged PR
  # (the checker reads rustdoc's JSON, whose format changes with the toolchain); raise them together
  semver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
      - name: Install cargo-binstall
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
      - name: Install cargo-semver-checks
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: cargo binstall cargo-semver-checks@0.51.0 --no-confirm
      - name: Compare the public API with the base revision
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          rust-toolchain: manual
          package: rodbus
          # every feature with public API; tls and tls-aws-lc can't be enabled together
          feature-group: only-explicit-features
          features: default,ffi,serialization
          # every change must be at most a minor release; derived from a pre-release version
          # (such as X.Y.Z-M3) the tool would skip every check
          release-type: minor
          baseline-rev: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  # Check that reading and parsing frames, answering requests, and formatting requests and replies
  # can't panic for any input
  # (rodbus/src/no_panic_check.rs), with arithmetic overflow checks off as in release and on as in
  # debug. The proof comes from the optimizer, so the toolchain is pinned:
  # a new one can lose an optimization and fail the link without any change to the code. Raise it
  # deliberately.
  no-panic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
      - name: Cache the build
        # only PR runs cache, so tag and merge-queue builds never restore one a PR wrote, and this
        # job builds nothing that ships
        if: github.event_name == 'pull_request' # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Link the no-panic check
        run: cargo test -p rodbus --lib --release --no-run
        env:
          RUSTFLAGS: --cfg rodbus_no_panic
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      - name: Link it again with overflow checks on
        run: cargo test -p rodbus --lib --release --no-run
        env:
          RUSTFLAGS: --cfg rodbus_no_panic
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
  # Everything below builds the bindings and their packages: in the merge queue, for release tags and
  # manual runs, not on a PR's own pushes.
  # A PR's FFI changes are compiled by the linting job's clippy on the workspace
  # Build API documentation packages
  documentation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install doxygen 1.9.5
        run: |
          wget -q https://github.com/stepfunc/ci-files/raw/2440f58201959ddfd6bca2597b48d3948bb08948/doxygen/doxygen-1.9.5.linux.bin.tar.gz -O doxygen.tar.gz
          echo "3b46471e7d4c3496e194d95042c7e5f738b93debacd22193aacc3df4dfe66267  doxygen.tar.gz" | sha256sum -c -
          sudo tar --strip-components=1 -C /usr -xzf doxygen.tar.gz doxygen-1.9.5
          rm doxygen.tar.gz
      - name: Build FFI and JNI
        run: cargo build --release -p rodbus-ffi-c -p rodbus-ffi-java
      - name: Build Rustdoc
        run: cargo doc -p rodbus --no-deps
      - name: C bindings
        run: cargo run --bin rodbus-bindings -- --c --doxygen --no-tests
      - name: .NET bindings
        run: cargo run --bin rodbus-bindings -- --dotnet --doxygen --no-tests
      - name: Java bindings
        run: cargo run --bin rodbus-bindings -- --java
      - name: Extract documentation
        run: |
          mkdir -p ~/doc
          cp -a target/doc ~/doc/rust
          cp -a ffi/bindings/c/generated/doc/c ~/doc/c
          cp -a ffi/bindings/c/generated/doc/cpp ~/doc/cpp
          cp -a ffi/bindings/dotnet/rodbus/doc ~/doc/dotnet
          cp -a ffi/bindings/java/rodbus/target/apidocs ~/doc/java
          rm ffi/bindings/c/generated/logo.png ffi/bindings/c/generated/doxygen-awesome.css
      - name: Upload documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-api
          path: ~/doc
  # Build bindings on Windows x64 [64-bit MSVC (Windows 10+) (x86_64-pc-windows-msvc)] and x86 [32-bit MSVC (Windows 10+) (i686-pc-windows-msvc)]
  bindings-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc # 64-bit MSVC (Windows 10+)
            test: true
          - target: i686-pc-windows-msvc # 32-bit MSVC (Windows 10+)
            test: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Create the FFI modules dir
        run: mkdir ffi-modules\${{ matrix.target }}
      - name: Build FFI
        shell: bash
        run: bash .github/scripts/build-evidence.sh evidence/ffi/${{ matrix.target }} cargo -p rodbus-ffi-c --target ${{ matrix.target }} --no-default-features --features tls-aws-lc,serial
      - name: Build JNI
        shell: bash
        run: bash .github/scripts/build-evidence.sh evidence/java/${{ matrix.target }} cargo -p rodbus-ffi-java --target ${{ matrix.target }} --no-default-features --features tls-aws-lc,serial
      - name: Copy the FFI and JNI libs
        shell: pwsh
        run: |
          Copy-Item -Path ./target/${{ matrix.target }}/release/rodbus_ffi.dll -Destination ffi-modules/${{ matrix.target }}
          Copy-Item -Path ./target/${{ matrix.target }}/release/rodbus_ffi.dll.lib -Destination ffi-modules/${{ matrix.target }}
          Copy-Item -Path ./target/${{ matrix.target }}/release/rodbus_ffi_java.dll -Destination ffi-modules/${{ matrix.target }}
      - name: Upload compiled FFI modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffi-modules-${{ matrix.target }}
          path: ffi-modules
      - name: Upload build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.target }}
          path: evidence
      - name: C Bindings Tests
        if: ${{ matrix.test }}
        run: cargo run --bin rodbus-bindings -- --c -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
      - name: Test .NET Bindings
        if: ${{ matrix.test }}
        run: cargo run --bin rodbus-bindings -- --dotnet -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
      - name: Test Java Bindings
        if: ${{ matrix.test }}
        run: cargo run --bin rodbus-bindings -- --java -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
  # Build bindings on MacOS [64-bit macOS (10.7+, Lion+) (x86_64-apple-darwin)]
  bindings-macos:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Create FFI modules dir
        run: mkdir -p ffi-modules/${{ matrix.target }}
      - name: Build FFI
        run: bash .github/scripts/build-evidence.sh evidence/ffi/${{ matrix.target }} cargo -p rodbus-ffi-c --target ${{ matrix.target }} --no-default-features --features tls-aws-lc,serial
      - name: Build JNI
        run: bash .github/scripts/build-evidence.sh evidence/java/${{ matrix.target }} cargo -p rodbus-ffi-java --target ${{ matrix.target }} --no-default-features --features tls-aws-lc,serial
      - name: Copy the FFI and JNI libs
        run: |
          cp ./target/${{ matrix.target }}/release/librodbus_ffi.dylib ./ffi-modules/${{ matrix.target }}
          cp ./target/${{ matrix.target }}/release/librodbus_ffi_java.dylib ./ffi-modules/${{ matrix.target }}
      - name: Upload compiled FFI modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffi-modules-${{ matrix.target }}
          path: ffi-modules
      - name: Upload build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.target }}
          path: evidence
      - name: Test .NET bindings
        run: cargo run --bin rodbus-bindings -- --dotnet -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
      - name: Test Java bindings
        run: cargo run --bin rodbus-bindings -- --java -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
  # Cross-compilation for Linux to produce portable C and JNI libraries
  bindings-linux:
    if: github.event_name != 'pull_request'
    env:
      # By default, MUSL will not produce a cdylib with dynamic linkage to MUSL LIB C
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=-crt-static"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=-crt-static"
      CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_RUSTFLAGS: "-C target-feature=-crt-static"
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu # 64-bit Linux (kernel 3.2+, glibc 2.17+)
          - i686-unknown-linux-gnu # 32-bit Linux (kernel 3.2+, glibc 2.17+)
          - x86_64-unknown-linux-musl # 64-bit Linux with MUSL
          - arm-unknown-linux-gnueabihf # ARMv6 Linux, hardfloat (kernel 3.2, glibc 2.17)
          - arm-unknown-linux-musleabihf # ARMv6 Linux with MUSL, hardfloat
          - aarch64-unknown-linux-gnu # ARM64 Linux (kernel 4.1+, glibc 2.17+)
          - aarch64-unknown-linux-musl # ARM64 Linux with MUSL
          - armv7-unknown-linux-gnueabihf # ARMv7 Linux, hardfloat (kernel 3.2, glibc 2.17)
          - arm-unknown-linux-gnueabi # ARMv6 Linux (kernel 3.2, glibc 2.17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install Rust Cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Create FFI modules dir
        run: mkdir -p ffi-modules/${{ matrix.target }}
      - name: Build FFI
        run: bash .github/scripts/build-evidence.sh evidence/ffi/${{ matrix.target }} cross -p rodbus-ffi-c --target ${{ matrix.target }} --no-default-features --features tls-aws-lc,serial
      - name: Build JNI
        run: bash .github/scripts/build-evidence.sh evidence/java/${{ matrix.target }} cross -p rodbus-ffi-java --target ${{ matrix.target }} --no-default-features --features tls-aws-lc,serial
      - name: Copy the FFI and JNI libs
        run: |
          cp ./target/${{ matrix.target }}/release/librodbus_ffi.so ./ffi-modules/${{ matrix.target }}
          cp ./target/${{ matrix.target }}/release/librodbus_ffi_java.so ./ffi-modules/${{ matrix.target }}
      - name: Upload compiled FFI modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffi-modules-${{ matrix.target }}
          path: ffi-modules
      - name: Upload build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.target }}
          path: evidence
  guide:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        working-directory: guide
        run: npm ci
      - name: Build guide
        working-directory: guide
        run: |
         npm run build
         mkdir -p ~/doc/guide
         mv build/* ~/doc/guide
      - name: Upload guide
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-guide
          path: ~/doc
  # Package all the generated bindings
  packaging:
    needs: [documentation, bindings-windows, bindings-macos, bindings-linux]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install bom-tools
        # 0.3.0
        run: cargo install --locked --git https://github.com/stepfunc/bom-tools.git --rev a5c5797217b26f74f5682c0551daaffa501f7fd6
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download compiled FFI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ffi-modules-*
          path: ffi-modules
          merge-multiple: true
      - name: Download build evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: evidence
          pattern: evidence-*
          merge-multiple: true
      - name: Create third-party license reports and SBOMs
        run: |
          cargo metadata --format-version 1 --all-features --locked > metadata.json
          COMMON="-m metadata.json -c allowed.json"
          bom-tools licenses -e evidence/ffi --root-package rodbus-ffi-c $COMMON > third-party-licenses.txt
          bom-tools licenses -e evidence/java --root-package rodbus-ffi-java $COMMON > third-party-licenses-java.txt
          mkdir sboms
          bom-tools sbom -e evidence/ffi --root-package rodbus-ffi-c $COMMON --lockfile Cargo.lock > sboms/rodbus-ffi.cdx.json
          bom-tools sbom -e evidence/java --root-package rodbus-ffi-java $COMMON --lockfile Cargo.lock > sboms/rodbus-ffi-java.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: sboms
      - name: Package C/C++ bindings
        run: cargo run --bin rodbus-bindings -- --c --package ./ffi-modules --options ./packaging.json -f third-party-licenses.txt -f sboms/rodbus-ffi.cdx.json
      - name: Package .NET bindings
        run: cargo run --bin rodbus-bindings -- --dotnet --package ./ffi-modules --options ./packaging.json -f third-party-licenses.txt -f sboms/rodbus-ffi.cdx.json
      - name: Package Java bindings
        run: cargo run --bin rodbus-bindings -- --java --package ./ffi-modules --options ./packaging.json -f third-party-licenses-java.txt -f sboms/rodbus-ffi-java.cdx.json
      - name: Upload C/C++ bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-bindings
          path: ffi/bindings/c/generated/*
      - name: Upload .NET bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-bindings
          path: ffi/bindings/dotnet/nupkg/*
      - name: Upload Java bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-bindings-jar
          path: ffi/bindings/java/rodbus/target/*.jar
      - name: Upload Java pom.xml
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-bindings-pom
          path: ffi/bindings/java/rodbus/pom.xml
  # The one roll-up check: branch protection and the merge queue require it, and the release jobs
  # wait on it. It passes only if every job the event runs passed. Packaging (with the
  # documentation and platform builds it needs) is skipped on a PR's own pushes; that skip is the
  # only one that passes
  quality-gate:
    needs: [linting, features, msrv, test, semver, no-panic, packaging]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the CI jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e --arg event "$EVENT" 'to_entries | all(
            .value.result == "success"
            or (.value.result == "skipped" and .key == "packaging" and $event == "pull_request"))'

  # Release jobs - each can run independently and is idempotent
  release-docs:
    needs: [packaging, guide, quality-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: doc-*
      - name: Checkout stepfunc/docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the push step uses the deploy key this checkout keeps, and this job uploads no artifacts
          # zizmor: ignore[artipacked]
          repository: stepfunc/docs
          ssh-key: ${{ secrets.SFIO_DOCS_SSH_KEY }}
          path: docs
      - name: Upload docs
        working-directory: docs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # Pull latest changes to avoid conflicts
          git pull
          # Remove and recreate docs directory
          rm -rf ./rodbus/${GITHUB_REF_NAME}
          mkdir -p ./rodbus/${GITHUB_REF_NAME}
          cp -a ../artifacts/doc-api/* ./rodbus/${GITHUB_REF_NAME}
          cp -a ../artifacts/doc-guide/* ./rodbus/${GITHUB_REF_NAME}
          # Remove versions superseded under the docs repo's retention policy
          ./scripts/prune.sh
          # Send docs.stepfunc.io/rodbus/ to the guide of the newest full release (not milestones or RCs),
          # chosen from the published versions so that releasing an older maintenance version doesn't move it back
          latest=$(ls ./rodbus | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -n "$latest" ]]; then
            echo "<!DOCTYPE html><meta charset=\"utf-8\"><title>Rodbus documentation</title><meta http-equiv=\"refresh\" content=\"0; url=./$latest/guide/docs/guide/\"><link rel=\"canonical\" href=\"./$latest/guide/docs/guide/\">" > ./rodbus/index.html
          fi
          # Check if there are actual changes to commit
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit - docs already up to date"
          else
            git commit -m "[rodbus] release ${GITHUB_REF_NAME}"
            git push
          fi

  release-maven:
    needs: [packaging, quality-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Java artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: java-bindings-*
      - name: Import PGP key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.SFIO_PGP_PRIVATE_KEY }}
          passphrase: ${{ secrets.SFIO_PGP_PRIVATE_KEY_PASSPHRASE }}
      - name: Deploy Java to Maven Central
        shell: bash
        working-directory: artifacts
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.SFIO_PGP_PRIVATE_KEY_PASSPHRASE }}
        run: |
          # Check if artifact already exists or is being published
          if curl -f -s -o /dev/null "https://repo1.maven.org/maven2/io/stepfunc/rodbus/${GITHUB_REF_NAME}/rodbus-${GITHUB_REF_NAME}.jar"; then
            echo "✅ Artifact io.stepfunc:rodbus:${GITHUB_REF_NAME} already exists in Maven Central - skipping deployment"
          else
            echo "Artifact not found in Maven Central - checking if deployment is in progress..."

            # Create base64 encoded token for Authorization header
            AUTH_TOKEN=$(echo -n "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_TOKEN" | base64 -w 0)

            # Try to upload - if it fails due to duplicate, that means it's already being processed
            echo "Attempting to upload to Central Portal..."

            # Create Maven repository structure (starting from groupId)
            mkdir -p io/stepfunc/rodbus/${GITHUB_REF_NAME}

            # Copy artifacts to bundle directory
            cp java-bindings-pom/pom.xml io/stepfunc/rodbus/${GITHUB_REF_NAME}/rodbus-${GITHUB_REF_NAME}.pom
            cp java-bindings-jar/rodbus-${GITHUB_REF_NAME}.jar io/stepfunc/rodbus/${GITHUB_REF_NAME}/
            cp java-bindings-jar/rodbus-${GITHUB_REF_NAME}-sources.jar io/stepfunc/rodbus/${GITHUB_REF_NAME}/
            cp java-bindings-jar/rodbus-${GITHUB_REF_NAME}-javadoc.jar io/stepfunc/rodbus/${GITHUB_REF_NAME}/

            # Sign all files. v7 of ghaction-import-gpg does not configure a default
            # signing key, so select it explicitly by fingerprint (the action's
            # recommended user ID) to avoid "no default secret key" errors.
            cd io/stepfunc/rodbus/${GITHUB_REF_NAME}
            for file in *.jar *.pom; do
              gpg --batch --yes --pinentry-mode loopback --local-user "$GPG_FINGERPRINT" --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$file"
            done

            # Generate checksums
            for file in *.jar *.pom; do
              md5sum "$file" | cut -d' ' -f1 > "$file.md5"
              sha1sum "$file" | cut -d' ' -f1 > "$file.sha1"
            done

            # Create bundle zip
            cd ../../../..
            zip -r bundle.zip io/

            # Upload bundle to Central Portal
            echo "Uploading bundle to Central Portal..."
            RESPONSE=$(curl -X POST \
              "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
              -H "Authorization: Bearer $AUTH_TOKEN" \
              -H "Content-Type: multipart/form-data" \
              -F "bundle=@bundle.zip;type=application/octet-stream" \
              -w "\nHTTP_STATUS:%{http_code}" \
              -s)

            # Extract HTTP status code
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | sed '$d')  # Remove last line with status code

            echo "Response: $BODY"
            echo "HTTP Status: $HTTP_STATUS"

            # Handle response
            if [[ $HTTP_STATUS -ge 200 && $HTTP_STATUS -lt 300 ]]; then
              # The API returns the deployment ID as plain text, not JSON
              DEPLOYMENT_ID=$(echo "$BODY" | tr -d '[:space:]')
              echo "✅ Upload successful! Deployment ID: $DEPLOYMENT_ID"
              echo "The deployment will be automatically published to Maven Central after validation."
            elif [[ $HTTP_STATUS -eq 400 ]] && [[ "$BODY" =~ "duplicate" || "$BODY" =~ "already exists" || "$BODY" =~ "PUBLISHED" ]]; then
              echo "✅ Version ${GITHUB_REF_NAME} is already uploaded or being processed - skipping deployment"
            else
              echo "❌ Upload failed with status $HTTP_STATUS"
              echo "Error details: $BODY"
              exit 1
            fi
          fi

  # Release jobs that publish to crates.io and nuget.org. Both registries trust this workflow in
  # these environments (trusted publishing), so neither needs a stored API key
  release-nuget:
    needs: [packaging, quality-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download .NET artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-bindings
          path: artifacts/dotnet-bindings
      # the temporary API key lasts an hour, so get it just before pushing
      - name: Authenticate with nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet package
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # Use --skip-duplicate to make this idempotent
          dotnet nuget push $(find artifacts/dotnet-bindings/rodbus*.nupkg) \
            -s https://api.nuget.org/v3/index.json \
            -k "$NUGET_API_KEY" \
            --skip-duplicate

  release-crates-io:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Check the tag matches the crate version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rodbus") | .version')
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "❌ tag ${GITHUB_REF_NAME} doesn't match the crate version $VERSION"
            exit 1
          fi
      - name: Check whether this version is already published
        id: published
        run: |
          VERSION=${GITHUB_REF_NAME}
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-all-errors \
            -A "stepfunc/rodbus release workflow" "https://crates.io/api/v1/crates/rodbus/$VERSION")
          case "$STATUS" in
            200)
              echo "✅ rodbus $VERSION already published to crates.io - skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "Publishing rodbus $VERSION to crates.io..."
              ;;
            *)
              echo "❌ crates.io returned HTTP $STATUS"
              exit 1
              ;;
          esac
      - name: Authenticate with crates.io
        if: steps.published.outputs.skip != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish to crates.io
        if: steps.published.outputs.skip != 'true'
        run: cargo publish -p rodbus
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  create-github-release:
    needs: [release-docs, release-maven, release-nuget, release-crates-io]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    # creates the draft release and uploads its assets
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Package C Bindings
        run: |
          mkdir release
          cd artifacts/c-bindings
          zip -r ../../release/rodbus-${GITHUB_REF_NAME}.zip .
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: |
            release/*.zip
            artifacts/dotnet-bindings/rodbus*
            artifacts/java-bindings-jar/*.jar
            artifacts/sboms/*.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
