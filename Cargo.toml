[workspace]
resolver = "2"

members = [
  "rodbus",
  "rodbus-client",
  # example binaries
  "examples/client",
  "examples/server",
  "examples/perf",
  # integration tests
  "integration",
  # FFI crates
  "ffi/rodbus-bindings",
  "ffi/rodbus-ffi",
  "ffi/rodbus-ffi-c",
  "ffi/rodbus-ffi-java",
  "ffi/rodbus-schema",
]

[workspace.dependencies]
oo-bindgen = "0.8.8"
sfio-tokio-ffi = "0.9.0"
sfio-tracing-ffi = "0.9.0"
tokio = "1"
tokio-util = "0.7"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.package]
authors = ["Step Function I/O LLC <info@stepfunc.io>>"]
rust-version = "1.94"
edition = "2021"
license-file = "LICENSE.txt"
homepage = "https://stepfunc.io/products/libraries/modbus/"
repository = "https://github.com/stepfunc/rodbus"
keywords = ["dnp3", "ics", "scada", "security"]
categories = ["network-programming"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rodbus_no_panic)'] }
unsafe_code = "forbid"
non_ascii_idents = "deny"
unreachable_pub = "deny"
trivial_casts = "deny"
missing_docs = "deny"
unused = { level = "deny", priority = -1 }
missing_copy_implementations = "deny"
unused_crate_dependencies = "deny"

[profile.release]
lto=true
# each crate as one codegen unit can optimize better than split up, so the shipped FFI and JNI
# libraries come out smaller, at the cost of slower release builds
codegen-units=1
